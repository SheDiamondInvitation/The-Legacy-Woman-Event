<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>SHEDIAMOND The Legacy Woman Invitation</title>

<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="apple-touch-icon" href="favicon-apple.png" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
    overflow-y:hidden;
  }

  section {
    height: 100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    padding:2rem 1rem;
    overflow:hidden;
  }

  .hero {
    background:url('bb.jpeg') center center no-repeat;
    background-size:cover;
    position:relative;
    overflow:hidden;
  }

  .hero::before {
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.3);
  }

  .hero-box {
    position: relative;
    background: rgba(10,10,20,0.7);
    padding:4rem;
    border-radius:16px;
    box-shadow:0 0 25px rgba(255,255,0,0.4);
    backdrop-filter: blur(10px);
    display:flex;
    flex-direction: column;
    align-items:center;
    max-width: 500px;
    width:95%;
    opacity:0;
    transform:translateY(20px);
    transition: all 0.8s ease;
  }

  .hero-box.active {
    opacity:1;
    transform:translateY(0);
  }

  .hero-box h1, .hero-box h2 {
    color:white;
    margin-bottom:0.5rem;
  }

  #countdown {
    display:flex;
    gap:10px;
    justify-content:center;
    align-items:center;
    margin-bottom:0.5rem;
  }

  .count-unit {
    display:flex;
    flex-direction:column;
    align-items:center;
    width:3em;
  }

  .count-unit .number {
    display:block;
    height:2em;
    line-height:2em;
    text-align:center;
    color:white;
    animation: heartbeat 2s infinite;
  }

  .unit-label {
    font-size:0.7rem;
    color:white;
    margin-top:4px;
    text-shadow:0 0 6px rgba(255,255,255,0.7);
    animation:none !important;
  }

  #toGo {
    display:block;
    font-size:1rem;
    color:white;
    margin-top:8px;
    text-shadow:0 0 8px rgba(255,255,255,0.9);
  }

  @keyframes heartbeat {
    0%,100%{transform:scale(1);}
    25%,75%{transform:scale(1.08);}
    50%{transform:scale(1);}
  }

  .hero-box input {
    margin-top:1rem;
    padding:12px;
    font-size:1rem;
    border-radius:8px;
    border:none;
    width:100%;
    outline:none;
  }

  .hero-box button {
    margin-top:1rem;
    padding:12px 20px;
    background:#d63384;
    color:white;
    font-weight:bold;
    border:none;
    border-radius:8px;
    cursor:pointer;
  }

  .loader {
    display:none;
    margin-top:1rem;
    border:4px solid #f3f3f3;
    border-top:4px solid #d63384;
    border-radius:50%;
    width:30px;
    height:30px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
  }

  #openingLogo {
    position: fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.5);
    width:200px;
    height:200px;
    z-index:1500;
    animation: logoZoom 3.3s ease forwards;
  }

  @keyframes logoZoom {
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.5);}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.05);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1);}
  }

  .twinkle {
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:0.8;
    animation: twinkleAnim 2s infinite;
  }

  @keyframes twinkleAnim {
    0%,100%{opacity:0.8;}
    50%{opacity:0;}
  }

  #heroContent {
    transition: all 0.5s ease;
  }

  #heroContent.hide {
    opacity: 0;
    transform: translateY(-10px);
    pointer-events: none;
  }

/* ==========================================
   NEW ENVELOPE POPUP
========================================== */

.invite-popup{

    --popup-width:360px;
    --popup-height:500px;

    --card-width:225px;
    --ticket-width:150px;

    position:relative;

    width:var(--popup-width);
    height:var(--popup-height);

    margin:auto;

    overflow:hidden;

    border-radius:30px;

}

/* ===========================
   RIGHT TICKET
=========================== */

.ticket-panel{

    position:absolute;

    top:0;
    right:0;

    width:var(--ticket-width);
    height:100%;

    z-index:10;

    pointer-events:none;

}

/* ticket image */

.popup-ticket{

    width:100%;
    height:100%;

    display:block;

    object-fit:contain;

}
/* ===========================
   LEFT WHITE CARD
=========================== */

.white-card{

    position:absolute;

    top:0;
    left:0;

    width:var(--card-width);
    height:100%;

    background:#fff;

    border-radius:30px;

    padding:26px;

    box-sizing:border-box;

    z-index:1;

    display:flex;
    flex-direction:column;

}
.ticket-cut{

    position:absolute;

    right:-22px;

    width:44px;

    height:44px;

    background:transparent;

    border-radius:50%;

    box-shadow:22px 0 0 #ffffff;

    z-index:20;

}

.ticket-cut.top{

    top:22px;

}

.ticket-cut.bottom{

    bottom:22px;

}
 .ticket-cut{
    display:none;
}
 
/* ================= MOBILE ================= */

@media(max-width:768px){

    .invite-popup{

        width:95vw;
        
        height:auto;

        min-height:360px;

    }

    .white-card{

        width:74%;

        min-height:360px;

        padding:16px;

    }

    .ticket-panel{

        width:32%;

    }

    .popup-title{

        font-size:18px;

    }

    .popup-subtitle{

        font-size:12px;

    }

    .popup-name{

        font-size:18px;

        margin-bottom:10px;

    }

    .reservation-box{

        padding:10px;

        font-size:15px;

        letter-spacing:3px;

        margin-bottom:12px;

    }

    .field-label{

        font-size:10px;

    }

    .gold-divider{

        margin:12px 0;

    }

    .info-row{

        margin-bottom:8px;

    }

    .info-row img{

        width:15px;

        height:15px;

    }

    .info-row span{

        font-size:10px;

        line-height:1.3;

    }

    .reminder-box{

        padding:10px;

        font-size:10px;

        gap:8px;

    }

    .reminder-box img{

        width:18px;

        height:18px;

    }

    .done-btn{

        padding:10px;

        font-size:13px;

    }

}

 /* =====================================
   DETAILS SECTION
===================================== */

.details-section{

    border-top:1px solid #EFEFEF;

    border-bottom:1px solid #EFEFEF;

    padding:14px 0;

    margin-top:10px;

    margin-bottom:10px;

}

.info-row{

    display:flex;

    align-items:flex-start;

    gap:10px;

    margin-bottom:12px;

}

.info-row:last-child{

    margin-bottom:0;

}

.info-row img{

    width:18px;

    height:18px;

    flex-shrink:0;

    margin-top:2px;

}

.info-row span{

    color:#555;

    font-size:13px;

    line-height:1.45;

}

/* =====================================
   BUTTON OVERRIDE
===================================== */

.white-card .done-btn{
    width:58%;
    align-self:center;

    margin-top:auto !important;

    background:linear-gradient(
        135deg,
        #F9D978,
        #D8A13A,
        #B97C13
    ) !important;

    color:#fff !important;

    border:none !important;

    padding:14px 18px;

    border-radius:40px;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    box-shadow:0 10px 25px rgba(184,124,19,.25);

}

.white-card .done-btn:hover{

    transform:translateY(-2px);

}

/* =====================================
   HERO OVERRIDE
===================================== */

.hero-box.show-popup{

    width:100%;
    height:100%;

    display:flex;

    justify-content:flex-start;   /* Moves popup down */
    align-items:center;

    padding-top:45px;             /* Adjust this value */
    padding-left:16px;
    padding-right:16px;
    padding-bottom:16px;

    box-sizing:border-box;

    background:transparent;

}

/* =====================================
   MOBILE
===================================== */

@media(max-width:768px){

    .details-section{

        padding:8px 0;

    }

    .info-row{

        gap:6px;

        margin-bottom:8px;

    }

    .info-row img{

        width:14px;

        height:14px;

    }

    .info-row span{

        font-size:10px;

        line-height:1.25;

    }

}
 
</style>
</head>

<body>

<img src="logo.png" id="openingLogo" alt="SheDiamond Logo" />

<div id="mainContent" style="display:none;">

<section class="hero" id="home">
  <div class="hero-box" id="heroBox">

    <div id="heroContent">
      <h2>SheDiamond Legacy Woman Invitation Checker</h2>

      <div id="countdown"></div>
      <span id="toGo">TO GO!</span>

      <input type="tel" id="phoneInput" placeholder="Enter Phone Number" />
      <button onclick="checkInvite()">Check</button>
      <div class="loader" id="loader"></div>
    </div>

    <div id="twinkles"></div>

  </div>
</section>

</div>

<script>
setTimeout(()=>{
  document.getElementById('openingLogo').style.display='none';
  const main=document.getElementById('mainContent');
  main.style.display='block';

  const heroBox=document.getElementById('heroBox');
  if(heroBox) setTimeout(()=>heroBox.classList.add('active'),200);
},3300);

// countdown
const countdownEl=document.getElementById('countdown');
const eventDate=new Date("July 23, 2026 11:30:00").getTime();
const units=['Days','Hours','Minutes','Seconds'];
const spans={};

units.forEach(u=>{
  const div=document.createElement('div');
  div.className='count-unit';

  const span=document.createElement('span');
  span.className='number';
  span.innerText='0';
  div.appendChild(span);

  const label=document.createElement('span');
  label.className='unit-label';
  label.innerText=u;
  div.appendChild(label);

  countdownEl.appendChild(div);
  spans[u]=span;
});

function updateCountdown(){
  const now=new Date().getTime();
  let diff=eventDate-now; if(diff<0) diff=0;

  const d=Math.floor(diff/(1000*60*60*24));
  const h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  const m=Math.floor((diff%(1000*60*60))/(1000*60));
  const s=Math.floor((diff%(1000*60))/1000);

  const values=[d,h,m,s];

  units.forEach((unit,i)=>{
    const span=spans[unit];
    span.innerText=values[i];
  });
}
setInterval(updateCountdown,1000);
updateCountdown();

// twinkles
const twinkleContainer=document.getElementById('twinkles');
for(let i=0;i<30;i++){
  const t=document.createElement('div');
  t.classList.add('twinkle');
  t.style.left=Math.random()*100+'%';
  t.style.top=Math.random()*100+'%';
  twinkleContainer.appendChild(t);
}

// ✅ MAIN FUNCTION
async function checkInvite(){
  const phone=document.getElementById("phoneInput").value.trim();
  const loader=document.getElementById("loader");
  const heroBox=document.getElementById("heroBox");
  const heroContent=document.getElementById("heroContent");

  if(phone.length!==11){
    alert("Enter a valid 11-digit number");
    return;
  }

  loader.style.display="block";

  const data=await fetch("list.json?"+Date.now())
  .then(r=>r.json())
  .catch(()=>{
    loader.style.display="none";
    alert("Error loading list");
    return null;
  });

  loader.style.display="none";

  if(data && data[phone]){
    const rec=data[phone];

    heroContent.classList.add("hide");

    setTimeout(()=>{
     heroBox.classList.add("show-popup");
      heroBox.innerHTML=`
        <div class="invite-popup">

    <div class="ticket-panel">
        <img
            src="ticket-preview.png"
            class="popup-ticket"
            alt="Invitation Ticket">
    </div>

    <div class="white-card">

        <div class="ticket-cut top"></div>
        <div class="ticket-cut bottom"></div>

        <!-- Header -->

        <div class="popup-header">

            <div class="celebrate-icon">🎉</div>

            <div>

                <div class="popup-title">
                    Congratulations!
                </div>

                <div class="popup-subtitle">
                    Your seat is reserved.
                </div>

            </div>

        </div>

        <!-- Gold Divider -->

        <div class="gold-divider">

            <span>◇</span>

        </div>

        <!-- Name -->

        <div class="field-label">

            NAME

        </div>

        <div class="popup-name">

            ${rec.name}

        </div>

        <!-- Reservation -->

        <div class="field-label">

            RESERVATION CODE

        </div>

        <div class="reservation-box">

            ${rec.reservation}

        </div>

        <!-- Details -->

        <div class="details-section">

            <div class="info-row">

                <img src="icons/calendar.svg">

                <span>Saturday, 1st August 2026</span>

            </div>

            <div class="info-row">

                <img src="icons/clock.svg">

                <span>8:30 AM – 12:00 Noon</span>

            </div>

            <div class="info-row">

                <img src="icons/location.svg">

                <span>

                    McGovern Hall,<br>

                    St. Agnes Catholic Church,<br>

                    Maryland Bus Stop,<br>

                    Ikeja, Lagos.

                </span>

            </div>

        </div>

        <!-- Reminder -->

        <div class="reminder-box">

            <img src="icons/shield.svg">

            <div>

                <strong>Please screenshot this invitation.</strong><br>

                Show this pass at the registration desk.

            </div>

        </div>

        <button class="done-btn"

                onclick="goBack()">

            Done

        </button>

    </div>

</div>
      `;
    },300);

  } else {
    heroContent.classList.add("hide");

    setTimeout(()=>{
      heroBox.innerHTML=`
        <h3 style="color:white;">😔 Invitation Not Found</h3>
        <p style="color:rgba(255,255,255,0.8);">Please contact your group admin.</p>

        <button onclick="goBack()" style="
          margin-top:1rem;
          padding:12px 20px;
          background:#d63384;
          color:white;
          font-weight:bold;
          border:none;
          border-radius:8px;
          cursor:pointer;
          width:100%;
        ">
          ← Back
        </button>
      `;
    },300);
  }
}

// ✅ BACK FUNCTION (OUTSIDE)
function goBack(){
  const heroBox=document.getElementById("heroBox");

  heroBox.innerHTML=`
    <div id="heroContent">
      <h2>SheDiamond Legacy Woman Invitation Checker</h2>

      <div id="countdown"></div>
      <span id="toGo">TO GO!</span>

      <input type="tel" id="phoneInput" placeholder="Enter Phone Number" />
      <button onclick="checkInvite()">Check</button>
      <div class="loader" id="loader"></div>
    </div>
  `;

  rebuildCountdown();
  reconnectCountdown();
  updateCountdown();
}

// ✅ REBUILD COUNTDOWN
function rebuildCountdown(){
  const countdownEl=document.getElementById('countdown');
  countdownEl.innerHTML='';

  units.forEach(u=>{
    const div=document.createElement('div');
    div.className='count-unit';

    const span=document.createElement('span');
    span.className='number';
    span.innerText='0';
    div.appendChild(span);

    const label=document.createElement('span');
    label.className='unit-label';
    label.innerText=u;
    div.appendChild(label);

    countdownEl.appendChild(div);
  });
}

 function reconnectCountdown(){
  const units = ['Days','Hours','Minutes','Seconds'];
  const elements = document.querySelectorAll('#countdown .number');

  units.forEach((unit, i) => {
    spans[unit] = elements[i];
  });
}
</script>

</body>
</html>
